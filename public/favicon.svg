<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="dryrun-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="dryrun-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  <!-- Squircle Base with Dynamic Gradient -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#dryrun-bg)" />
  <!-- Glossy Inner Rim Highlight -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="7.5" stroke="url(#dryrun-shine)" stroke-width="1" />
  <!-- Code Prompt Chevron: Bold execution pointer -->
  <path d="M8.5 8.5L17.5 16L8.5 23.5" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Execution Step Cursor Bar: Terminal active trace indicator -->
  <path d="M19 21.5H24.5" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" />
  <!-- Micro Execution Bead -->
  <circle cx="21.5" cy="11.5" r="1.5" fill="#FFFFFF" fill-opacity="0.9" />
</svg>
